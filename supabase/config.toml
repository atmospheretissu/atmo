# Atmosphère Tissus — Supabase project config
# Linked project ref: mryvgigwmbuusbxzgoym (Paris, eu-west-3)

project_id = "atmosphere-tissus"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = ["http://localhost:3001/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false  # admin-only invites in V1

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
